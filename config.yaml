# macOS FS Metrics - example config
#
# Two ready-to-use modes:
#   simulate: true   -> synthetic data, runs on ANY OS, great for the dashboard
#                        demo and for developing off a Mac.
#   simulate: false  -> real collection via diskutil/iostat/nfsstat. Requires
#                        macOS and the volumes listed below to actually exist.

host_label: "demo-mac-studio"
db_path: "metrics.db"

poll_interval_seconds: 10          # health + performance cadence
capacity_scan_interval_seconds: 60 # per-user walk cadence (expensive, less frequent)

simulate: true

volumes:
  - path: "/"
    kind: "apfs"
    label: "Macintosh HD"
    watch_users: true
    scan_paths:
      - "/Users"

  - path: "/Volumes/Research"
    kind: "nfs"
    label: "Research (NFS/pNFS)"
    watch_users: true
    scan_paths:
      - "/Volumes/Research"

thresholds:
  capacity_pct_warn: 80.0
  capacity_pct_crit: 95.0
  user_growth_bytes_window: 600        # seconds
  user_growth_bytes_threshold: 5000000000  # 5 GB grown in the window = alert
  io_error_count_threshold: 1
  throughput_stall_seconds: 120

# Optional: POST {"text": "..."} to a Slack-compatible incoming webhook on
# every new alert. Leave null to disable.
webhook_url: null
